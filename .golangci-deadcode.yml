# The dead-code check (`make deadcode`): code that only a test uses.
#
# The repository's own `unused` linter (.golangci.yml) runs with tests on, so a function, a field or an
# option that only a test calls counts as used and is never reported. This configuration runs `unused`
# alone with the tests left out, so that what is reported is code the production build carries and
# nothing in the production build needs. `make deadcode` runs it with and without the `live` build tag.
# It is a separate file so that the main configuration keeps its tests on.
version: "2"

run:
  tests: false

linters:
  default: none
  enable:
    - unused
