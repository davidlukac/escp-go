# CodeQL code scanning, advanced setup.
#
# Why not the default setup: its Go autobuild is a cold `go build ./...` with no module or
# build cache, about 11 minutes of a 12 minute job. Here the shared setup action restores the
# Go caches and Go is built by an explicit step. The actions language needs no build.
#
# Conventions: third-party actions are pinned to commit SHAs (the comment names the release).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, as the default setup did, so new queries run against an unchanged main.
    - cron: "17 4 * * 1"

# A newer push to the same PR supersedes the running one. A push to main is never superseded: its
# group is its own run (see test.yml).
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.language == 'go'
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint, pinned here, rejects `$/` (rhysd/actionlint#711)
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        name: Build
        run: go build ./...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
