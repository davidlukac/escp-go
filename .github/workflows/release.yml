# Publishes a version of the library when its tag is pushed. For Go the tag on the public
# repository is the release (the module proxy serves any tag), so this workflow does what is left:
# it checks the tag, re-runs the checks on the tagged tree, writes the GitHub release whose notes
# are the CHANGELOG section of that version, then asks the proxy and pkg.go.dev for the version and
# proves that a fresh module can install it and build the program in examples/consumer against it.
#
# Procedure (RELEASING.md): the release PR is merged, `scripts/release.sh --tag X.Y.Z` tags the merge
# commit, a maintainer pushes that tag (the push is what publishes). To re-run for a tag
# that exists (a failed step, a version released before this workflow did all of it):
#   gh workflow run release.yml -f tag=vX.Y.Z      (every step is safe to repeat; a tag from before
#                                                   examples/consumer existed is built with main's copy)
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.0 (must exist on the remote)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      MODULE: github.com/davidlukac/escp-go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: The tag is a version and is on main
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $TAG"; exit 1;; esac
          git fetch origin main
          git merge-base --is-ancestor "$TAG" origin/main || { echo "$TAG is not on main"; exit 1; }
      - uses: ./.github/actions/setup
        with:
          go-version: stable
      - name: Tests and checks of the tagged tree
        run: |
          make cover
          make lint
          make vuln
      - name: The notes of this version are in the CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 == "## " v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section '## $version'"; exit 1; }
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "the release $TAG exists already"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
      # The proxy fetches a version the first time anyone asks. Ask now, so the version is cached
      # and listed for pkg.go.dev, and retry: a new tag can take a moment to be visible.
      - name: The module proxy serves the version
        run: |
          for i in 1 2 3 4 5 6; do
            GOWORK=off GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org go list -m "$MODULE@$TAG" && exit 0
            echo "not served yet, attempt $i"; sleep 20
          done
          exit 1
      # The program is examples/consumer of the tagged tree: the same file that every pull request
      # compiles, so it cannot fall behind the API the way a copy inside this workflow did. A tag
      # from before that program existed (up to v0.8.0) uses the copy on main, which is the program
      # of the API those releases have; a tag whose API it no longer matches fails here, and the
      # proxy step above is then the proof that the version installs.
      - name: A fresh module installs it and builds against every package
        run: |
          dir="$(mktemp -d)"
          if [ -f examples/consumer/main.go ]; then
            cp examples/consumer/main.go "$dir/main.go"
          else
            echo "$TAG has no examples/consumer: using the copy on main"
            git show origin/main:examples/consumer/main.go > "$dir/main.go"
          fi
          cd "$dir"
          go mod init example.com/consumer
          GOWORK=off GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org go get "$MODULE@$TAG"
          GOWORK=off GOPROXY=https://proxy.golang.org go run .
      # pkg.go.dev indexes new versions from the proxy by itself; this asks it to do so now. Not
      # fatal: the page appears either way.
      - name: Ask pkg.go.dev to index the version
        continue-on-error: true
        run: curl -fsS -X POST "https://pkg.go.dev/fetch/$MODULE@$TAG"
