# Mutation testing (gremlins, pinned in devtools/go.mod): the code's conditionals, boundaries and
# arithmetic are flipped one at a time, and the tests of the package must fail for each. Coverage says a
# line ran; this says a test would notice if it were wrong. `make mutation` and `make mutation-diff`
# reproduce both jobs locally.
#
#   * On a pull request: only the lines the PR changes (a minute or two). Informational: it shows the
#     mutants that survived in the job summary; an equivalent mutant is not a reason to bend a test.
#   * Weekly and on request: the whole module (about a quarter of an hour). It fails below the efficacy
#     threshold, so a slow slide in test quality is noticed.
name: Mutation testing

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "devtools/go.mod"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      efficacy:
        description: Fail below this percentage of caught mutants
        default: "90"

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changed:
    name: Mutants in the changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-version: stable
      - name: Mutate the lines this pull request changes
        run: make mutation-diff BASE="origin/${BASE_REF}" WORKERS=4
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Summary
        if: always()
        run: go run ./internal/mutationreport build/mutation.json >> "$GITHUB_STEP_SUMMARY"

  whole-module:
    name: The whole module
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write # the badge goes to the `badges` branch, as the coverage badge does
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          go-version: stable
      - name: Mutate every covered operator
        run: make mutation WORKERS=4 EFFICACY="${EFFICACY}"
        env:
          EFFICACY: ${{ inputs.efficacy || '90' }}
      - name: Summary
        if: always()
        run: go run ./internal/mutationreport build/mutation.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: build/mutation.json
          if-no-files-found: ignore
          retention-days: 30
      # The score of the run, as a shields.io endpoint file on the `badges` branch (written by CI only,
      # never by hand; the README badge reads it from there). Only a run of main publishes it, and
      # only from a report that was read, so a run that stopped early leaves the last badge in place.
      - name: Compute the mutation score badge
        id: badge
        if: always() && github.ref == 'refs/heads/main' && hashFiles('build/mutation.json') != ''
        run: |
          go run ./internal/mutationreport badge build/mutation.json > "$RUNNER_TEMP/mutation.json"
          cat "$RUNNER_TEMP/mutation.json"
      - name: Publish to the badges branch
        if: always() && steps.badge.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A second worktree: the main checkout stays on the commit the job was built from,
          # because the job's post step for ./.github/actions/setup reads that action from it.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges:refs/remotes/origin/badges
            git worktree add --force -B badges "$RUNNER_TEMP/badges" origin/badges
          else
            git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/mutation.json" mutation.json
          git add mutation.json
          git diff --cached --quiet && { echo "mutation score unchanged"; exit 0; }
          git commit -m "chore: mutation score $(jq -r .message mutation.json)"
          # the coverage job writes to the same branch (another file): on a rejected push, take its commit
          # in and push again
          for attempt in 1 2 3; do
            git push origin badges && exit 0
            git pull --rebase origin badges
          done
          exit 1
