# CI for github.com/davidlukac/escp-go. Everything runs against the in-process fake switch
# (escptest): no hardware, and the `live` tests are only compiled, never run.
#
# Conventions:
#   * Third-party actions are pinned to commit SHAs (the comment names the release);
#     Dependabot keeps the SHAs current.
#   * Steps call the Makefile, so a local `make <target>` reproduces CI.
#   * Shared setup lives in .github/actions/setup.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR supersedes the running one. A push to main is never superseded: its
# group is its own run, because with one group per branch GitHub cancels the run that is pending
# when a newer one queues, and a burst of merges left canceled runs (and a failing badge) on main.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned tools (devtools/go.mod) need a newer Go than the module's floor.
      - uses: ./.github/actions/setup
        with:
          go-version: stable
      # `go mod tidy -diff` fails when tidy would change go.mod or go.sum (for the module and for
      # devtools); `go mod verify` fails when a downloaded dependency differs from go.sum.
      - name: Module files are tidy and verified
        run: make modcheck
      - name: Build, including the live tests
        run: |
          go build ./...
          go vet ./...
          go vet -tags live ./...
      # The linter and govulncheck are the versions pinned in devtools/go.mod, the same ones
      # `make pre-commit` runs locally.
      - name: Lint
        run: make lint
      - name: Known vulnerabilities
        run: make vuln
      # The pinned actionlint (devtools/go.mod), the same one the pre-commit hook runs.
      - name: Workflow files are valid
        run: make actionlint
      - name: Go files are formatted
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: The README compatibility table is generated from safety/compatibility.json
        run: make compat-table && git diff --exit-code README.md

  # Go matrix: "go.mod" is the minimum the module declares (the supported floor),
  # "stable" is the newest release and catches toolchain regressions early.
  unit:
    name: Unit tests (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["go.mod", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go-version: ${{ matrix.go }}
      # Race detector, whole module, and the coverage policy: every statement
      # covered unless its function says `// coverage: ignore - <reason>`.
      - name: Tests with coverage policy
        run: make cover
      - name: Coverage report
        if: always()
        run: |
          [ -f cover.out ] || exit 0
          go tool cover -html=cover.out -o coverage.html
          {
            echo "### Coverage"
            echo '```'
            go tool cover -func=cover.out | tail -1
            echo '```'
            echo "Per-function detail: download the \`coverage\` artifact (coverage.html)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-go-${{ matrix.go }}
          path: |
            cover.out
            coverage.html
          if-no-files-found: ignore
          retention-days: 14

  # The client shares its UDP reply port differently per system (SO_REUSEPORT on macOS and
  # Linux, its own socket option on Windows), so the tests run on macOS and Windows too.
  other-systems:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and vet
        run: |
          go build ./...
          go vet ./...
      - name: Tests
        run: go test -count=1 ./...

  # What a pull request changes in the exported API, as the release tool sees it. Informational
  # while the module is 0.x (breaking changes are allowed, the CHANGELOG must name them).
  api:
    name: Exported API changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          go-version: stable
      - name: Compare with the latest release
        run: |
          if git describe --tags --abbrev=0 >/dev/null 2>&1; then
            make apidiff | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No release yet: nothing to compare with."
          fi

  # The provider's `main` built and tested against this pull request's tree of the library, so a
  # change the library's own tests cannot see (a removed field, a changed default, a stricter
  # check) shows up here, before the merge, while the author can still decide. Informational, like
  # `api`: the provider requires a released library version, so a break found here is a migration
  # row of the CHANGELOG and a provider change after the release, not necessarily a reason to
  # change the pull request. It runs the provider's `go test ./...` only: the acceptance
  # scenarios (TF_ACC, `make testacc`) stay in the provider's own CI, and no `live` test is ever
  # compiled in. The Go version is the provider's own (its go.mod).
  canary:
    name: Provider against this change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: davidlukac/terraform-provider-tplinkeasysmart
          ref: main
          path: provider
          persist-credentials: false
      # The same action ./.github/actions/setup wraps, but reading the provider's go.mod: the
      # provider may need a newer Go than this module's floor.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: provider/go.mod
          cache: true
          cache-dependency-path: provider/go.sum
      # The provider's lifecycle tests drive a real Terraform CLI; without one on PATH each test
      # downloads its own and the job times out (the provider's own setup action does this too).
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false
      # A go.work (the mechanism of the provider's `make work`) links this checkout, one directory
      # up, in place of the library version the provider's go.mod requires; go.mod stays untouched.
      - name: Build and test the provider with this library tree
        id: with-change
        working-directory: provider
        run: |
          go work init . ..
          go build ./...
          go test -race -count=1 ./...
      # Tells "this change breaks the provider" from "the provider is red on its own": the same
      # build and tests with the library version its go.mod requires. It never fails the job, the
      # step above already did; the verdict is the annotation and the job summary.
      - name: Does the provider pass without this change?
        if: failure() && steps.with-change.outcome == 'failure'
        working-directory: provider
        env:
          GOWORK: "off"
        run: |
          if go build ./... && go test -race -count=1 ./...; then
            verdict="This library change breaks the provider: it builds and passes with the library version its go.mod requires."
          else
            verdict="The provider is red on its own, with the library version its go.mod requires: this may not be caused by this change."
          fi
          echo "::error title=Provider canary::${verdict}"
          echo "### Provider canary" >> "$GITHUB_STEP_SUMMARY"
          echo "${verdict}" >> "$GITHUB_STEP_SUMMARY"

  # Publishes the measured coverage as a shields.io endpoint file (coverage.json) on
  # the `badges` branch, written by CI only, never by hand. The README badge reads
  # it from there. Runs on pushes to main, from the go.mod-version unit run.
  coverage-badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # The one checkout that keeps its credentials: the badges branch is pushed below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-go-go.mod
          path: ${{ runner.temp }}/coverage
      - name: Compute coverage
        run: |
          go run ./internal/coverpolicy badge "$RUNNER_TEMP/coverage/cover.out" . > "$RUNNER_TEMP/coverage.json"
          cat "$RUNNER_TEMP/coverage.json"
      - name: Publish to the badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A second worktree: the main checkout stays on the commit the job was built from,
          # because the job's post step for ./.github/actions/setup reads that action from it.
          if git ls-remote --exit-code --heads origin badges >/dev/null 2>&1; then
            git fetch --depth=1 origin badges:refs/remotes/origin/badges
            git worktree add --force -B badges "$RUNNER_TEMP/badges" origin/badges
          else
            git worktree add --orphan -b badges "$RUNNER_TEMP/badges"
          fi
          cd "$RUNNER_TEMP/badges"
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet && { echo "coverage unchanged"; exit 0; }
          git commit -m "chore: coverage $(jq -r .message coverage.json)"
          git push origin badges
